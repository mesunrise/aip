name: Build Android APK

on:
  push:
    branches: [ main, develop ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout代码
      uses: actions/checkout@v4
    
    - name: 设置JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: gradle
    
    - name: 设置Android SDK
      uses: android-actions/setup-android@v3
    
    - name: 授予gradlew执行权限
      run: chmod +x android-app/gradlew
    
    - name: 构建Debug APK
      run: |
        cd android-app
        ./gradlew assembleDebug --stacktrace
    
    - name: 上传Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: android-app/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30
    
    - name: 获取版本信息
      id: version
      run: |
        VERSION=$(grep "versionName" android-app/app/build.gradle.kts | awk -F'"' '{print $2}')
        echo "version=$VERSION" >> $GITHUB_OUTPUT
    
    - name: 创建Release（仅标签触发）
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: android-app/app/build/outputs/apk/debug/app-debug.apk
        body: |
          ## 抖音自动化 ${{ steps.version.outputs.version }}
          
          ### 下载
          - [app-debug.apk](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/app-debug.apk)
          
          ### 安装说明
          1. 下载APK文件
          2. 在手机上安装
          3. 允许"未知来源"安装
          4. 打开App，输入服务器地址
          5. 点击"连接"开始使用
          
          ### 更新内容
          查看 [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
